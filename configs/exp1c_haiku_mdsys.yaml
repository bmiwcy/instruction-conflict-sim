# Control for exp1c: the same project md (no rule) moved from the first user message into the
# system prompt. Everything else as in exp1c_haiku.yaml. Analyzed together with that run.
name: exp1c_haiku_mdsys
runner: exp1c
scenario: prompts/exp1c_scenario.yaml
rule:
  check: zh
  system_text: "回答必须用中文。"
  md_line: "- 回答必须用中文。"
models: [claude-haiku-5-5]
rule_conds: [md_in_system]
audience: ["no", "yes"]
n_tools: [10, 25]
seeds_by_n: {10: 10, 25: 10}
thinking_level: default
empty_retries: 0              # final report is not measured in the main experiment
max_tokens: 32000
cache: true
workers: 6
analyze_with: [results/exp1c_haiku.jsonl]
