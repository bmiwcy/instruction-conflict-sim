# Exp 1c main run on Haiku 5.5 (fix A for the final report, audience sentence, no-md arm).
name: mock_exp1c
runner: exp1c
scenario: prompts/exp1c_scenario.yaml
rule:
  check: zh
  system_text: "回答必须用中文。"
  md_line: "- 回答必须用中文。"
models: [mock]
rule_conds: [no_md, none, md, system]
audience: ["no", "yes"]
n_tools: [0, 5, 10, 25]
seeds_by_n: {0: 3, 5: 3, 10: 10, 25: 10}   # budget concentrated where drift appears
thinking_level: default      # adaptive thinking at the model's default effort, summary returned
empty_retries: 2
max_tokens: 32000
cache: true
workers: 6
