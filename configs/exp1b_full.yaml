# Exp 1b full grid - run only after the pilot shows drift.
name: exp1b_full
runner: exp1b
rule:
  check: zh
  system_text: "回答必须用中文。"
  md_line: "- 回答必须用中文。"
project_md: prompts/project_md_draft.md
tasks:
  qa: prompts/turns_en.txt
  coding: prompts/tasks_coding_en_draft.txt
models: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5]
rule_placements: [system, md]
thinking_levels: ["off", low, high]      # Opus 5.5 cannot turn thinking off -> skipped
task_kinds: [qa, coding]
n_turns: 20
seeds: 3                               # DECIDE after seeing pilot cost
max_tokens: 64000
cache: true
shuffle_tasks: true
stop_at_first_violation: false
