      import logging
      from pathlib import Path

      import typer

      from .aggregate import aggregate
      from .io import iter_lines, write_parquet
      from .parse import parse_line

      log = logging.getLogger(__name__)
      app = typer.Typer()


      @app.command()
      def run(input_dir: Path, out_dir: Path, workers: int = 1) -> None:
          files = sorted(input_dir.glob("*.log.gz"))
          log.info("reading %d file(s)", len(files))
          records = []
          for line in iter_lines(files):
              rec = parse_line(line)
              if rec is not None:
                  records.append(rec)
          df = aggregate(records)
          log.info("aggregated %d records into %d rows", len(records), len(df))
          write_parquet(df, out_dir)
