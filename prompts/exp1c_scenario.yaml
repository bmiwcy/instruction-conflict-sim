      import re
      from dataclasses import dataclass
      from datetime import datetime

      LINE_RE = re.compile(
          r'(?P<ip>\S+) \S+ \S+ \[(?P<ts>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) \S+" '
          r'(?P<status>\d{3}) (?P<bytes>\d+) "[^"]*" "(?P<ua>[^"]*)" (?P<rt>[\d.]+)'
      )


      @dataclass(slots=True)
      class Record:
          ts: datetime
          endpoint: str
          status: int
          bytes_sent: int
          request_time: float
          user_agent: str


      def parse_line(line: str) -> Record | None:
          m = LINE_RE.match(line)
          if m is None:
              return None
          return Record(
              ts=_to_datetime(m["ts"]),
              endpoint=_normalize(m["path"]),
              status=int(m["status"]),
              bytes_sent=int(m["bytes"]),
              request_time=float(m["rt"]),
              user_agent=m["ua"],
          )


      def _to_datetime(s: str) -> datetime:
          return datetime.strptime(s, "%d/%b/%Y:%H:%M:%S %z")
