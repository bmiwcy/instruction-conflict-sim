      from __future__ import annotations

      from collections import defaultdict
      from dataclasses import dataclass
      from datetime import datetime

      import pandas as pd

      from .parse import Record
      from .ua import ua_family


      @dataclass
      class Bucket:
          count: int = 0
          bytes_sent: int = 0
          total_time: float = 0.0
          statuses: dict[int, int] | None = None


      def aggregate(records: list[Record]) -> pd.DataFrame:
          buckets: dict[tuple, Bucket] = defaultdict(Bucket)
          for r in records:
              minute = r.ts.replace(second=0, microsecond=0)
              key = (r.endpoint, minute, ua_family(r.user_agent))
              b = buckets[key]
              b.count += 1
              b.bytes_sent += r.bytes_sent
              b.total_time += r.request_time
              if b.statuses is None:
                  b.statuses = {}
              b.statuses[r.status] = b.statuses.get(r.status, 0) + 1
          rows = []
          for (endpoint, minute, ua), b in buckets.items():
              rows.append({
                  "endpoint": endpoint, "minute": minute, "ua_family": ua,
                  "count": b.count, "bytes_sent": b.bytes_sent,
                  "avg_time": b.total_time / b.count,
                  "status_5xx": sum(v for k, v in b.statuses.items() if k >= 500),
              })
          return pd.DataFrame(rows)
