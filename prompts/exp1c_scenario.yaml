# DRAFT scenario for experiment 1c (tool calls -> language drift). Review/replace.
# A generic Python project; unrelated to any real project.

# Agent-style system prompt present in ALL conditions (real coding agents always have one, in English).
agent_system: |
  You are a coding agent working in the user's repository. You can run shell commands with `bash`,
  read files with `read_file` and change files with `edit_file`. Work step by step: inspect the code,
  run commands to verify your assumptions, make focused changes, and run the tests before you report.
  When the task is done, give the user a short report of what you changed and what you measured.

# "Audience" sentence, added to the agent system prompt only in the audience=yes arm.
# Wording modelled on a real agent harness that says in-between text is not shown verbatim.
audience_sentence: |
  Text you write between tool calls is summarized for the user rather than shown to them verbatim;
  only your final message after the last tool call is shown to the user as written.

# Fix A: normal results for the model's own tool calls after the scripted steps, answered once,
# then the final report is requested with tool_choice=none. Outputs never contradict a command.
normal_outputs:
  bash: "(command finished with exit code 0, no output)"
  edit_file: "Applied edit (1 hunk)."
  read_file_unknown: "(file is empty)"

# Project instructions. {{RULE}} is replaced by the rule line (md condition) or removed (other conditions).
project_md: |
  # logpipe

  logpipe ingests nginx access logs, aggregates them per endpoint and per minute, and writes Parquet
  files that the dashboard reads.

  ## Layout
  - `logpipe/parse.py` - line parser (regex), returns `Record`
  - `logpipe/aggregate.py` - per-minute aggregation
  - `logpipe/io.py` - reading gz files, writing Parquet
  - `logpipe/cli.py` - `logpipe run <input_dir> <out_dir>`
  - `tests/` - pytest; `bench/` - benchmark scripts

  ## Conventions
  - Python 3.11, type hints, `ruff` + `black`.
  - No new runtime dependencies without asking.
  {{RULE}}
  - Run `pytest -q` before reporting; never commit with failing tests.
  - Benchmarks: `python bench/run.py --file bench/data/day.log.gz` (prints lines/s).

# Earlier part of the conversation (all Chinese). The model's own earlier replies are fixed here
# so every run starts from the same state.
history:
  - role: user
    content: |
      我们的 logpipe 最近变得很慢，处理一天的日志要 40 多分钟，以前只要 10 分钟左右。能先帮我分析一下可能的原因吗？先不用改代码。
  - role: assistant
    content: |
      从你的描述看，速度降到原来的四分之一，常见原因有这几类：

      1. **解析**：`parse.py` 里的正则如果每行都重新编译，或者写法导致回溯，会非常慢。
      2. **聚合**：`aggregate.py` 如果用 Python 字典逐行累加，再在最后转成 DataFrame，数据量一大就会成为瓶颈。
      3. **I/O**：读 gz 文件时如果一次只读一行、没有缓冲，或者写 Parquet 时每分钟写一次小文件，也会拖慢。
      4. **最近的改动**：如果是某次提交之后突然变慢，最快的办法是看 `git log`，对比那次改动。

      建议先跑一次 profiler，看时间到底花在哪里，再决定改哪一块。
  - role: user
    content: |
      最近确实改过聚合部分，加了按 user agent 分组。那你觉得应该怎么优化？
  - role: assistant
    content: |
      加了按 user agent 分组之后，分组的键从"接口 × 分钟"变成了"接口 × 分钟 × user agent"，组的数量会多很多。如果聚合是逐行往字典里累加，变慢就很正常了。

      我的建议是：

      1. 先用 profiler 确认瓶颈确实在聚合；
      2. 把逐行累加改成按批处理：先把一批记录收集成列，再一次性分组计算；
      3. user agent 字符串很长，可以先归一化成浏览器类别，减少分组数量；
      4. 改完用 `bench/run.py` 对比前后速度，并跑一遍测试确认结果一致。

      要我现在开始优化吗？
  - role: user
    content: 好的！请优化！

